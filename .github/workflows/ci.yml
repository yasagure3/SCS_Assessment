name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run frontend tests
        run: vp test --run

      - name: Run worker tests
        run: vp exec vitest run -c vitest.workers.config.ts

      - name: Type check + lint
        run: vp check

      - name: Build
        run: vp build

      - name: Production separation and administrator bootstrap
        run: |
          vp exec node scripts/check-production-build.mjs
          vp exec node --test tests/scripts/bootstrap-admin.check.mjs
          vp exec node --test scripts/preview-config.check.mjs

      - name: Install browser
        run: vp exec playwright install --with-deps chromium

      - name: Install independent report verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-venv
          python3 -m venv .local/report-qa-venv
          .local/report-qa-venv/bin/python -m pip install -r tests/pdf/requirements.txt

      - name: Browser smoke, feature flows and complete business journey
        run: vp exec playwright test
        env:
          E2E_PORT: "5180"
          PDF_QA_PYTHON: .local/report-qa-venv/bin/python
          EXCEL_QA_PYTHON: .local/report-qa-venv/bin/python

      - name: Reject occupied test port
        run: vp exec node scripts/check-port-conflict.mjs
