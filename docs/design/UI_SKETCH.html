function Modal({title,children,onClose,footer}){const restore=useRef(document.activeElement);const focusDialog=useRef(el=>{if(el)el.focus()});return <div className="modalback" onMouseDown={e=>{if(e.target===e.currentTarget){onClose();restore.current?.focus()}}}><div className="modal" role="dialog" aria-modal="true" aria-label={title} tabIndex={-1} ref={focusDialog.current} onKeyDown={e=>{if(e.key==='Escape'){onClose();restore.current?.focus()}if(e.key==='Tab'){let nodes=[...e.currentTarget.querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')];let first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===e.currentTarget)){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}}}><div className="modalhead"><h2>{title}</h2><button aria-label="閉じる" onClick={()=>{onClose();restore.current?.focus()}}><Icon name="close"/></button></div><div className="modalbody">{children}</div>{footer&&<div className="modalfoot">{footer}</div>}</div></div>}
class Boundary extends React.Component{constructor(p){super(p);this.state={error:false}}static getDerivedStateFromError(){return {error:true}}render(){return this.state.error?<div className="empty"><h2>画面を表示できませんでした</h2><p>再読み込みして、もう一度操作してください。試作の編集内容はリセットされます。</p><Btn onClick={()=>location.reload()}>再読み込み</Btn></div>:this.props.children}}

function Dashboard({rows,nav,openDetail,tasks,setFilter,client}){return <><Title eyebrow="ASSESSMENT / SCS ★3" title="いまの課題を、次の対策へ。" sub={`${client.name} · 初回診断 · 2026年9月18日`}><Btn icon="upload" onClick={()=>nav('import')}>Excel取込</Btn><Btn kind="primary" icon="file" onClick={()=>nav('report')}>レポートを確認</Btn></Title><Stats rows={rows} onFilter={s=>{setFilter(s);nav('criteria')}}/><div className="twocol"><section className="panel"><div className="panelhead"><div><h2>評価基準マップ</h2><p className="small muted">1マス＝1評価基準。選択して、根拠と対策を確認できます。</p></div><span className="mono small">81 CRITERIA</span></div><div className="panelpad"><Legend/>{CATEGORIES.map((cat,i)=><div className="matrixrow" key={cat}><div className="matrixlabel"><span className="mono muted">{i+1}.</span> {cat}</div><div className="matrixcells">{rows.filter(r=>r.category===cat).map(r=><button className={'tile '+STATUS_CLASS[r.status]} key={r.id} title={`${r.id} ${r.title} / ${STATUS_TEXT[r.status]}`} aria-label={`${r.id} ${r.title} ${STATUS_TEXT[r.status]}`} onClick={()=>openDetail(r.id)}>{r.status==='未回答'?'—':r.status}</button>)}</div><div className="mono small muted" style={{textAlign:'right'}}>{rows.filter(r=>r.category===cat).length}</div></div>)}</div><div style={{borderTop:'1px solid var(--line)',padding:'12px 22px',fontSize:11,color:'var(--muted)'}}>自己評価の集計です。制度上の取得判定は、専門家の確認等の手続により行われます。</div></section><div className="stack"><section className="panel panelpad"><div className="sectionlabel">NEXT ACTIONS</div><h2>先に確認したいこと</h2><div className="actionitem"><div className="row between"><strong>未回答の評価基準</strong><span className="issuecount number">{rows.filter(r=>r.status==='未回答').length}</span></div><p>未入力のままにせず、実施状況や対象範囲を確認します。</p><button className="linkbtn small" onClick={()=>{setFilter('未回答');nav('criteria')}}>未回答を見る →</button></div><div className="actionitem"><strong>インシデント対応手順</strong><p>役割・連絡先・初動手順を確認し、文書と実施記録を整理します。</p><button className="linkbtn small" onClick={()=>openDetail(rows.find(r=>r.requirementId= function Criteria({rows,filter,setFilter,openDetail}){const [search,setSearch]=useState(''),[cat,setCat]=useState('すべて');const filtered=rows.filter(r=>(filter==='すべて'||r.status===filter)&&(cat==='すべて'||r.category===cat)&&`${r.id} ${r.title} ${r.criterion}`.includes(search));return <><Title eyebrow="REQUIREMENTS" title="評価基準一覧" sub="公式要件、一次スクリーニング、確認結果を評価基準ごとに整理します。"/><section className="panel"><div className="toolbar"><div className="search"><Icon name="search"/><input aria-label="評価基準を検索" value={search} onChange={e=>setSearch(e.target.value)} placeholder="評価基準No.・キーワードで検索"/></div><select aria-label="大分類" value={cat} onChange={e=>setCat(e.target.value)}><option>すべて</option>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select><div className="spacer"/><span className="small muted">{filtered.length} / {rows.length}件</span></div><div className="toolbar"><div className="filterchips">{['すべて',...STATUSES].map(s=><button key={s} className={filter===s?'selected':''} onClick={()=>setFilter(s)}>{s==='すべて'?'すべて':`${s==='未回答'?'—':s} ${STATUS_TEXT[s]}`} <span className="mono">{s==='すべて'?rows.length:counts(rows)[s]}</span></button>)}</div></div><div className="tablewrap"><table><thead><tr><th>評価基準No.</th><th style={{minWidth:280}}>要求事項 / 評価基準</th><th>大分類</th><th>現在の自己評価</th><th>証跡の確認</th><th/></tr></thead><tbody>{filtered.map(r=><tr key={r.id} className="clickable" onClick={()=>openDetail(r.id)}><td className="mono nowrap">{r.id}</td><td><button className="linkbtn" onClick={e=>{e.stopPropagation();openDetail(r.id)}} style={{fontWeight:650,textDecoration:'none'}}>{r.title}</button><p className="muted" style={{marginTop:5,fontSize:11}}>{r.criterion.slice(0,84)}{r.criterion.length>84?'…':''}</p></td><td className="small">{r.category}</td><td><Badge status={r.status}/></td><td><span className="small muted">{r.verified?'担当者確認済み':'未確認'}</span></td><td><Icon name="chevron"/></td></tr>)}</tbody></table>{!filtered.length&&<Empty title="条件に一致する評価基準がありません" sub="検索語や絞り込み条件を変更してください。"><Btn onClick={()=>{setSearch('');setCat('すべて');setFilter('すべて')}}>条件をクリア</Btn></Empty>}</div></section></>}
function Detail({row,onSave,nav,openAI,addTask,evidence,addEvidence,confirmed,onConfirm,toast,drafts,onDraft}){const [status,setStatus]=useState(row.status),[reason,setReason]=useState(row.reason||''),[check,setCheck]=useState(row.verified||false),[tab,setTab]=useState('advice'),[existing,setExisting]=useState(row.existing||''),[planned,setPlanned]=useState(row.planned||''),[supplement,setSupplement]=useState(row.supplement||'');const g=guideFor(row);const advice=drafts[row.id]??confirmed[row.id]?.text??g.steps.join('\n');const setAdvice=text=>onDraft(row.id,text);const dirty=confirmed[row.id]?.text!==advice;const ev=evidence.filter(e=>e.criterion===row.id);return <><button className="linkbtn small" onClick={()=>nav('criteria')} style={{marginBottom:15}}>← 評価基準一覧へ</button><Title eyebrow={`CRITERION ${row.id}`} title={row.title} sub={`${row.category} / ${row.section}`}><Badge status={row.status}/><Btn kind="primary" onClick={()=>{onSave({...row,status,reason,verified:check,existing,planned,supplement});toast('判定と確認状況を、この試作内に保存しました。')}}>判定を保存</Btn></Title><div className="detailgrid"><section className="panel"><div className="panelhead"><h2>基準と現在の根拠</h2><span className="pill blue">★3</span></div><div className="sourceblock"><div className="sectionlabel">OFFICIAL CRITERION / {row.id}</div><p className="preline">{row.criterion}</p><p className="muted" style={{marginTop:12}}>出典：要求事項・評価基準 2026.03.27</p></div><div className="sourceblock"><div className="row between"><h3>取込時の自己評価</h3><Badge status={BASE.find(x=>x.id===row.id).status}/></div><p className="muted">製造版は元O列を保持します。このスケッチのO〜Rは配置確認用の合成例です。</p><details style={{marginTop:12}}><summary className="small" style={{cursor:'pointer',color:'var(--blue)'}}>元Excelの記述を見る（匿名の入力例）</summary><div style={{background:'var(--paper)',padding:14,marginTop:10,borderRadius:5}}><h3>P列：理由</h3><p>現行の運用と評価基準を照合中。文書と実施記録の確認が必要。</p><h3 style={{marginTop:12}}>Q列：根拠および実施する事</h3><p>関連規程に運用の一部を記載。対象範囲を確認し、足りない手順と記録を整備する。</p><h3 style={{marginTop:12}}>R列：補足情報</h3><p>関連規程 第2章（文書名・箇所の入力例）</p></div></details></div><div className="sourceblock stack"><label className="field">現在の自己評価<select value={status} onChange={e=>setStatus(e.target.value)}>{STATUSES.map(s=><option key={s} value={s}>{s} {STATUS_TEXT[s]}</option>)}</select></label><label className="field">判定理由・確認メモ<textarea value={reason} onChange={e=>setReason(e.target.value)} placeholder="確認した事実と、まだ確認できていないことを記載"/></label><label className="field">確認した既存の根拠<textarea value={existing} onChange={e=>setExisting(e.target.value)} placeholder="例：関連規程の該当条項、現行設定、運用記録"/></label><label className="field">今後の作業<textarea value={planned} onChange={e=>setPlanned(e.target.value)} placeholder="例：台帳を整備し、確認した結果を記録する"/></label><label className="field">補足情報<input value={supplement} onChange={e=>setSupplement(e.target.value)} placeholder="文書名・該当箇所・追加確認事項"/></label><label className="row small"><input type="checkbox" checked={check} onChange={e=>setCheck(e.target.checked)}/>担当者が根拠を確認した</label><div className="notice warn">対象外の可能性がある場合は、理由と範囲を記録します。この試作では分母から自動除外しません。</div></div><div className="sourceblock"><div className="row between"><h3>関連する証跡</h3><Btn kind="compact" icon="plus" onClick={()=>addEvidence(row.id)}>追加</Btn></div>{ev.length?ev.map(e=><div className="row" style={{marginTop:12}} key={e.id}><Icon name="file"/><div><strong className="small">{e.name}</strong><p className="muted">{e.location} · {e.checked?'確認済み':'未確認'}</p></div></div>):<p className="muted" style={{marginTop:10}}>証跡はまだ関連付けられていません。</p>}</div></section><section className="panel"><div className="tabstrip"><button className={tab==='advice'?'selected':''} onClick={()=>setTab('advice')}>改善アドバイス</button><button className={tab==='source'?'selected':''} onClick={()=>setTab('source')}>要求事項・出典</button></div>{tab==='advice'?<div className="panelpad"><div className="row between"><div><div className="sectionlabel">RECOMMENDED ACTION</div><h2>何を、どう整えるか</h2></div><span className="pill blue">定型助言の例</span></div><p className="small muted" style={{marginTop:10}}>要求事項単位の実装例です。選択した評価基準と顧客の現状に合わせて確認・編集してください。</p><div className="adviceflow">{g.steps.map((s,i)=><div className="advicestep" key={i}><span className="stepnum">{i+1}</span><span>{s}</span></div>)}</div><div className="sourceblock" style={{background:'var(--paper)',borderRadius:6,padding:16}}><h3>用意する証跡の例</h3><p>{g.evidence}</p><h3 style={{marginTop:14}}>完了を確認する観点</h3><p>{g.check}</p></div><div className="hr"/><div className="row between"><h3>顧客向けの助言</h3><Btn kind="compact soft" icon="spark" onClick={()=>openAI(row,setAdvice)}>AIで案を補う</Btn></div><label className="field" style={{marginTop:12}}><span className="muted" style={{fontWeight:400}}>内容を確認してからレポート掲載用に確定します。</span><textarea aria-label="顧客向け助言" style={{minHeight:145}} value={advice} onChange={e=>setAdvice(e.target.value)}/></label><div className="row wrap" style={{marginTop:15}}><Btn kind="primary" disabled={!advice.trim()} onClick={()=>{onConfirm(row.id,advice);toast('助言を確定しました。レポートに掲載されます。')}}>内容を確認して確定</Btn><Btn onClick={()=>addTask(row)}>改善課題に追加</Btn>{confirmed[row.id]&&!dirty&&<span className="pill good">確認・確定済み</span>}{confirmed[row.id]&&dirty&&<span className="pill warn">編集後の再確認が必要</span>}</div><p className="small muted" style={{marginTop:13}}>AIの未確認案は顧客向けレポートに含めません。</p></div>:<div className="panelpad stack"><h3>要求事項 {row.requirementId}</h3><p className="preline small">{row.requirement}</p><div className="notice">公式の要求と、このサービスで提示する実装例・助言は区別します。</div><a href="https://www.ipa.go.jp/security/scs/requirements-criteria.html" target="_blank" rel="noreferrer">IPAの要求事項・評価基準を開く ↗</a><a href="https://www.ipa.go.jp/security/scs/details.html" target="_blank" rel="noreferrer">制度と専門家確認の流れを確認 ↗</a><p className="small muted">解説書の公開状況は2026年9月18日の調査に基づきます。制度の変更時は診断時点の版を確認します。</p></div>}</section></div></>}
function ImportPage({nav,onImport}){const [step,setStep]=useState(1),[filename,setFilename]=useState(''),[scenario,setScenario]=useState('normal'),[error,setError]=useState('');return <><Title eyebrow="IMPORT" title="Excelから診断を始める" sub="列の対応と評価基準の件数を確認してから、回答を取り込みます。"/><div className="timeline">{['ファイルを選択','取込内容を確認','診断を開始'].map((s,i)=><div key={s} className={step===i+1?'current':''}><span className="mono">0{i+1}</span>　{s}</div>)}</div><div className="notice" style={{marginBottom:20}}>操作確認用です。選択したファイルの内容は読み取りません。「添付Excelの集計例」で、取込プレビューの流れを確認できます。</div>{step===1?<div className="twocol"><div className="panel panelpad stack"><div className="dropzone"><Icon name="upload"/><h2>スクリーニング結果を選択</h2><p className="small muted" style={{margin:'10px 0 20px'}}>★3・★4要求事項・評価基準 ＋ O〜R列</p><input aria-label="Excelファイルを選択（ファイル名のみ確認）" type="file" accept=".xlsx" onChange={e=>{const f=e.target.files[0];setFilename(f?.name||'');setError(f&&!f.name.toLowerCase().endsWith('.xlsx')?'拡張子が .xlsx のファイルを選択してください。':'')}}/>{filename&&<p className="small" style={{marginTop:12}}>{filename}（ファイル名のみ）</p>}{error&&<p style={{color:'var(--red)'}}>{error}</p>}</div><div className="row between wrap"><span className="small muted">例：scs_3（追記）.xlsx</span><Btn kind="primary" onClick={()=>setStep(2)}>添付Excelの集計例を表示 <Icon name="arrow"/></Btn></div></div><div className="panel panelpad"><h2>取込で確認する内容</h2><div className="adviceflow">{['評価基準No.で公式マスタと照合','結合セルを復元して★3を判別','O列の自己評価とP〜R列の記述を保持','未回答と不足を分けて集計'].map((s,i)=><div className="advicestep" key={s}><span className="stepnum">{i+1}</span>{s}</div>)}</div><p className="small muted">未知・重複・欠落した評価基準は、行番号とともに表示します。欠落を理由に分母を減らしません。</p></div></div>:<section className="panel"><div className="panelhead"><div><h2>取込内容のプレビュー</h2><p className="small muted">添付Excelの集計例 · ★3・★4要求事項・評価基準</p></div><select aria-label="取込結果の画面例" value={scenario} onChange={e=>setScenario(e.target.value)}><option value="normal">正常時の例</option><option value="missing">列不足の例</option><option value="duplicate">基準No.重複の例</option></select></div><div className="panelpad stack"><div className="threecol">{[['81件','★3の評価基準'],['76件','回答済み'],['5件','未回答']].map(([n,l])=><div key={l}><strong className="number" style={{fontSize:26}}>{n}</strong><p className="small muted">{l}</p></div>)}</div><div className="tablewrap"><table><thead><tr><th>Excelの列</th><th>システムの項目</th><th>扱い</th></tr></thead><tbody>{[['L','評価基準No.','公式マスタとの照合キー'],['O','自己評価','○・△・✖・未回答を保持'],['P','理由','判定理由の原文を保持'],['Q','根拠および実施する事','既存の根拠と今後の作業を確認'],['R','補足情報','文書名・URL・補足文を保持']].map(r=><tr key={r[0]}>{r.map((v,i)=><td key={i}>{v}</td>)}</tr>)}</tbody></table></div><div className={'notice '+(scenario==='normal'?'':'warn')}>{scenario==='normal'?'★4の追加72基準は、今回の★3診断の集計対象に含めません。未回答5件は確認対象として残します。':scenario==='missing'?'エラー例：O列「自己評価」が見つかりません。対応する列を確認して、再度選択してください。':'エラー例：評価基準No. 1-2-1-2 が7行目と8行目で重複しています。元Excelを修正してください。'}</div><div className="row between"><Btn onClick={()=>setStep(1)}>選択に戻る</Btn><Btn kind="primary" disabled={scenario!=='normal'} onClick={()=>{setStep(3);onImport()}}>この集計例で診断を開く</Btn></div><p className="small muted">この操作は試作内の現在の診断を集計例に戻します。実ファイルの取込・保存は製造フェーズで実装します。</p></div></section>}</>}
function Clients({clients,active,role,onSelect,onAdd,onScope}){const [search,setSearch]=useState('');const shown=clients.filter(c=>(role==='admin'||c.assigned)&&c.name.includes(search));return <><Title eyebrow="CLIENTS & ASSESSMENTS" title="顧客・診断案件" sub="顧客ごとに、診断の対象範囲と現在の状況を整理します。"><Btn kind="primary" icon="plus" onClick={onAdd}>顧客を追加</Btn></Title><section className="panel"><div className="toolbar"><div className="search"><Icon name="search"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="顧客名で検索" aria-label="顧客名で検索"/></div><span className="spacer"/><span className="small muted">{shown.length}社 · {role==='admin'?'管理者：全顧客':'担当者：割当顧客のみ'}</span></div><div className="tablewrap"><table><thead><tr><th>顧客 / 診断案件</th><th>対象範囲</th><th>目標</th><th>回答</th><th>操作</th></tr></thead><tbody>{shown.map(c=><tr key={c.id}><td><button className="linkbtn" style={{fontWeight:700,textDecoration:'none'}} onClick={()=>onSelect(c.id)}>{c.name}</button><p className="small muted">初回診断{active===c.id?' · 選択中':''}</p></td><td><p>{c.scope.company}</p><p className="small muted">{c.scope.sites}</p></td><td><span className="pill blue">★3</span></td><td><span className="pill">{c.loaded?'取込済み':'未取込'}</span></td><td><div className="row"><Btn kind="compact" onClick={()=>onScope(c)}>範囲を編集</Btn><Btn kind="compact soft" onClick={()=>onSelect(c.id)}>診断を開く</Btn></div></td></tr>)}</tbody></table>{!shown.length&&<Empty title="該当する顧客がありません" sub="検索条件を変えるか、顧客を追加してください。"/>}</div></section><p className="footerhint">社名は匿名の例です。仮置きの権限では、管理者が顧客の割当を管理します。</p></>}
function Tasks({tasks,setTasks,openDetail,toast}){const [filter,setFilter]=useState('すべて'),[review,setReview]=useState(null),[reviewed,setReviewed]=useState(false);const stages=['未着手','対応中','確認待ち','完了確認済'];const update=(id,k,v)=>setTasks(tasks.map(t=>t.id===id?{...t,[k]:v}:t));return <><Title eyebrow="IMPROVEMENT PLAN" title="改善課題" sub="作業の完了と、要件を満たしたかどうかの確認を分けて管理します。"/><div className="notice" style={{marginBottom:20}}>担当・期限・進捗は入力例です。完了確認を行っても、評価基準の自己評価は自動で○に変更しません。</div><section className="panel"><div className="toolbar"><div className="filterchips">{['すべて',...stages].map(s=><button className={filter===s?'selected':''} key={s} onClick={()=>setFilter(s)}>{s} <span className="mono">{tasks.filter(t=>s==='すべて'||t.stage===s).length}</span></button>)}</div></div>{tasks.filter(t=>filter==='すべて'||t.stage===filter).map(t=><div className="taskline" key={t.id}><div><div className="row wrap"><span className={'pill '+(t.priority==='高'?'bad':'blue')}>優先度 {t.priority}（提案）</span><button className="linkbtn mono small" onClick={()=>openDetail(t.criterion)}>{t.criterion}</button></div><strong style={{fontSize:12,display:'block',marginTop:7}}>{t.title}</strong>{t.due<'2026-09-18'&&t.stage!=='完了確認済'&&<span className="small" style={{color:'var(--red)'}}>期限超過</span>}{t.stage==='確認待ち'&&<button className="linkbtn small" style={{display:'block',marginTop:5}} onClick={()=>{setReview(t);setReviewed(false)}}>証跡・完了条件の確認を記録</button>}{t.stage==='完了確認済'&&<span className="small muted">確認者：診断担当 · この試作で確認</span>}</div><label className="field"><span className="muted">担当者</span><input value={t.owner} onChange={e=>update(t.id,'owner',e.target.value)} aria-label={`${t.title}の担当者`}/></label><label className="field"><span className="muted">期限</span><input type="date" value={t.due} onChange={e=>update(t.id,'due',e.target.value)}/></label><label className="field"><span className="muted">進捗</span><select value={t.stage} onChange={e=>update(t.id,'stage',e.target.value)}>{stages.filter(s=>s!=='完了確認済'||t.stage==='完了確認済').map(s=><option key={s}>{s}</option>)}</select></label></div>)}{!tasks.filter(t=>filter==='すべて'||t.stage===filter).length&&<Empty title="この状態の改善課題はありません" sub="評価基準の詳細から、具体的な改善課題を追加できます。"/>}</section>{review&&<Modal title="改善作業の完了を確認" onClose={()=>setReview(null)} footer={<><Btn onClick={()=>setReview(null)}>閉じる</Btn><Btn kind="primary" disabled={!reviewed} onClick={()=>{update(review.id,'stage','完了確認済');setReview(null);toast('作業の完了確認を記録しました。基準の判定は別に確認してください。')}}>完了確認を記録</Btn></>}><div className="stack"><h3>{review.title}</h3><p className="small">評価基準：{review.criterion}</p><div className="notice"><strong>確認する内容</strong><p>{guideFor(BASE.find(r=>r.id===review.criterion)).check}</p></div><div><h3>確認する証跡の例</h3><p className="small">{guideFor(BASE.find(r=>r.id===review.criterion)).evidence}</p></div><button className="linkbtn small" onClick={()=>openDetail(review.criterion)}>基準詳細と関連証跡を確認する →</button><label className="row small"><input type="checkbox" checked={reviewed} onChange={e=>setReviewed(e.target.checked)}/>作業結果と根拠を確認し、完了条件を満たすことを確認した</label><p className="small muted">完了記録は作業に対する確認です。基準の自己評価は自動で変更しません。</p></div></Modal>}</>}
function Evidence({items,setItems,add,openDetail,toast}){return <><Title eyebrow="EVIDENCE" title="証跡管理" sub="評価の根拠となる文書・設定・運用記録を、該当する基準に紐づけます。"><Btn kind="primary" icon="plus" onClick={()=>add('1-2-1-2')}>証跡を追加</Btn></Title><section className="panel"><div className="panelhead"><h2>文書と確認状況</h2><span className="small muted">{items.length}件</span></div><div className="tablewrap"><table><thead><tr><th>文書名 / 該当箇所</th><th>関連する評価基準</th><th>参照・添付</th><th>確認状況</th><th>操作</th></tr></thead><tbody>{items.map(e=><tr key={e.id}><td><div className="row"><Icon name="file"/><strong>{e.name}</strong></div><p className="small muted" style={{marginTop:6}}>{e.location}</p></td><td><button className="linkbtn mono" onClick={()=>openDetail(e.criterion)}>{e.criterion}</button></td><td>{e.url&&<a href={e.url} target="_blank" rel="noreferrer">参照先を開く ↗</a>}{e.file?<button className="linkbtn" onClick={()=>{const url=URL.createObjectURL(e.file);const a=document.createElement('a');a.href=url;a.download=e.file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}>{e.file.name}</button>:!e.url&&<span className="small muted">参照情報の入力例</span>}</td><td><span className={'pill '+(e.checked?'good':'warn')}>{e.checked?'内容確認済み':'未確認'}</span></td><td><Btn kind="compact" onClick={()=>{setItems(items.map(i=>i.id===e.id?{...i,checked:!i.checked}:i));toast('証跡の確認状況を変更しました。判定は自動変更しません。')}}>{e.checked?'未確認に戻す':'内容の確認を記録'}</Btn></td></tr>)}</tbody></table></div></section><div className="notice" style={{marginTop:20}}>AIには証跡ファイル本文を送信しません。この試作で選択したファイルは画面を閉じると失われます。</div></>}
function Compare({rows,onDemo,openDetail}){const changed=rows.filter(r=>BASE.find(b=>b.id===r.id)?.status!==r.status);return <><Title eyebrow="REASSESSMENT" title="再診断の比較" sub="取込時の状態と、いまの回答を比較します。△は判断未確定の状態として扱います。"><Btn onClick={onDemo}>状態変更のデモを適用</Btn></Title><div className="panel panelpad row between wrap" style={{marginBottom:20}}><div><span className="small muted">比較元</span><h3>初回取込時</h3></div><Icon name="arrow"/><div><span className="small muted">比較先</span><h3>現在の編集内容</h3></div><div><span className="pill blue">同一制度版・同一範囲の例</span></div><div className="number" style={{fontSize:28}}>{changed.length}<span className="small muted"> 件の状態変更</span></div></div><section className="panel"><div className="tablewrap"><table><thead><tr><th>評価基準No.</th><th>要求事項</th><th>取込時</th><th>現在</th><th>確認状況</th></tr></thead><tbody>{changed.map(r=><tr key={r.id}><td><button className="linkbtn mono" onClick={()=>openDetail(r.id)}>{r.id}</button></td><td>{r.title}</td><td><Badge status={BASE.find(b=>b.id===r.id).status}/></td><td><Badge status={r.status}/></td><td className="muted">{r.verified?'担当者確認済み':'根拠を確認してください'}</td></tr>)}</tbody></table>{!changed.length&&<Empty title="現在、状態の変更はありません" sub="評価基準を編集するか、デモを適用すると差分を確認できます。"/>}</div></section><div className="notice" style={{marginTop:20}}>本番では診断時点ごとに結果を保存します。適用範囲や制度版が異なる場合は、単純比較できない項目を明示します。</div></>}
function Report({rows,client,confirmed,nav,onExport,pendingDraftCount}){const [detail,setDetail]=useState(false);const c=counts(rows);const confirmedEntries=Object.entries(confirmed).filter(([id])=>rows.some(r=>r.id===id));const issueRows=rows;return <><Title eyebrow="REPORT" title="診断レポート" sub="経営層向けの概要と、実務担当者向けの具体的な対策をまとめます。"><Btn icon="download" onClick={()=>onExport('Excel')}>Excel出力の確認</Btn><Btn kind="primary" icon="file" onClick={()=>onExport('PDF')}>PDF出力の確認</Btn></Title><div className="reportcontrols row between wrap" style={{marginBottom:18}}><div className="filterchips"><button className={!detail?'selected':''} onClick={()=>setDetail(false)}>経営層向けサマリー</button><button className={detail?'selected':''} onClick={()=>setDetail(true)}>評価基準別の詳細</button></div><span className="small muted">確定済み助言 {confirmedEntries.length}件 / 未確定の作成・更新案 {pendingDraftCount}件は掲載対象外</span></div><article className="report"><header className="reporttop"><div className="row between"><span className="mono small">SCS ASSESSMENT REPORT</span><span className="pill blue">★3 取得準備</span></div><h1 style={{marginTop:22}}>セキュリティ対策<br/>現状診断レポート</h1><div className="row between" style={{marginTop:20}}><strong>{client.name}</strong><span className="small muted">2026年9月18日 · 画面確認用</span></div></header><p><strong>対象範囲：</strong>{client.scope.company} / {client.scope.sites} / {client.scope.departments} / {client.scope.systems}</p><p className="muted" style={{marginTop:6}}>参照：SCS要求事項・評価基準 2026.03.27　｜　集計単位：評価基準</p><Stats rows={rows} compact/><div className="notice">一次スクリーニング結果を整理した診断支援資料です。★3取得には専門家の確認等が必要です。</div>{!detail?<><h2>現状と対応の方向性</h2><p>自己評価では{c['○']}件が「満たしている」、{c['△']}件が「判断微妙」、{c['✖']}件が「不足」、{c['未回答']}件が未回答です。確認が必要な項目を、根拠資料と実際の運用に照らして整理します。</p><h2>大分類別の状況</h2><div className="tablewrap"><table><thead><tr><th>大分類</th><th>○</th><th>△</th><th>✖</th><th>未回答</th></tr></thead><tbody>{CATEGORIES.map(cat=><tr key={cat}><td>{cat}</td>{STATUSES.map(s=><td key={s} className="mono">{rows.filter(r=>r.category===cat&&r.status===s).length}</td>)}</tr>)}</tbody></table></div><h2>担当者が確定した改善助言</h2>{confirmedEntries.length?confirmedEntries.map(([id,a])=><div key={id} style={{margin:'15px 0'}}><strong className="small">{id}　{rows.find(r=>r.id===id).title}</strong><p className="preline" style={{marginTop:6}}>{a.text}</p></div>):<p className="muted">確定済みの助言はありません。評価基準詳細で内容を確認・確定すると、ここに掲載されます。</p>}</>:<><h2>評価基準別の詳細 {issueRows.length}件</h2><div className="tablewrap"><table><thead><tr><th>評価基準</th><th>自己評価 / 根拠確認</th><th>確定済みの対策</th></tr></thead><tbody>{issueRows.map(r=><tr key={r.id}><td style={{minWidth:190}}><strong className="mono">{r.id}</strong><p>{r.title}</p></td><td><Badge status={r.status}/><p className="small muted">{r.verified?'担当者確認済み':'根拠未確認'}</p></td><td className="preline">{confirmed[r.id]?.text||'助言未確定'}</td></tr>)}</tbody></table></div></>}<div className="hr"/><p className="muted">作成：診断担当者　｜　匿名の画面例。制度の登録・取得を証する文書ではありません。</p></article></>}
function Settings({role,setRole,clients,toast}){return <><Title eyebrow="SETTINGS" title="管理・利用設定" sub="社内利用者の権限と、AIに渡せる情報の範囲を管理します。"/><div className="twocol"><section className="panel"><div className="panelhead"><h2>利用者とアクセス範囲</h2><span className="pill warn">権限は仮置き</span></div><div className="panelpad stack"><div className="row"><span className="avatar">診</span><div><strong>診断担当（デモ）</strong><p className="small muted">招待制 · パスワード＋多要素認証</p></div></div><label className="field">プレビューする役割<select value={role} onChange={e=>{setRole(e.target.value);toast('表示する役割を切り替えました。実際の権限変更は行いません。')}}><option value="admin">管理者：全顧客</option><option value="staff">担当者：割当顧客のみ</option></select></label><div className="notice">仮定：管理者は全顧客と利用者の割当を管理し、担当者は自分に割り当てられた顧客だけを閲覧・編集します。</div><h3>割当の例</h3>{clients.filter(c=>role==='admin'||c.assigned).map(c=><div className="row between" key={c.id}><span>{c.name}</span><span className="pill">{c.assigned?'担当者に割当済み':'管理者のみ'}</span></div>)}</div></section><section className="panel"><div className="panelhead"><h2>AI利用の条件</h2><span className="pill good">回答済み</span></div><div className="panelpad stack"><p className="small">送信対象は、評価基準と担当者が確認した匿名化済みの回答・不足点だけです。</p><div className="sourceblock" style={{background:'var(--paper)',borderRadius:5}}><h3>送信に含めないもの</h3><p>証跡ファイル本文、元Excel、顧客名、個人名、連絡先、内部URL</p></div><p className="small muted">匿名化内容を送信前に確認する画面を設けます。AIの出力は下書きとし、担当者が確定した内容のみレポートへ掲載します。</p><div className="notice warn">AI事業者・モデル・契約、保存先、保持期間、利用規模は未確定です。このスケッチでは外部AIへの送信やクラウド保存を行いません。</div></div></section></div></>}
function Auth({mode,setMode,onLogin,toast}){const [email,setEmail]=useState('demo@example.invalid'),[password,setPassword]=useState(''),[code,setCode]=useState('');return <div className="auth"><div className="row" style={{color:'var(--blue)',marginBottom:25}}><Icon name="shield"/><strong>SCS 診断支援</strong></div><h1 style={{fontSize:23}}>{mode==='mfa'?'確認コードを入力':mode==='reset'?'パスワード再設定':mode==='invite'?'招待から利用を開始':'担当者ログイン'}</h1><p className="subtitle" style={{marginBottom:24}}>認証の画面例です。実際のパスワードは入力しないでください。</p>{mode==='mfa'?<div className="stack"><p className="small">認証アプリの6桁コードを入力します。試作では <span className="mono">000000</span> を入力してください。</p><label className="field">確認コード<input inputMode="numeric" maxLength={6} value={code} onChange={e=>setCode(e.target.value)} autoComplete="off"/></label><Btn kind="primary" disabled={code!=='000000'} onClick={onLogin}>確認して診断画面へ</Btn><button className="linkbtn small" onClick={()=>setMode('login')}>ログインに戻る</button></div>:<form className="stack" onSubmit={e=>{e.preventDefault();if(mode==='reset'){toast('試作のため、再設定メールは送信しません。');setMode('login')}else if(mode==='invite'){toast('招待確認・パスワード設定・MFA登録の画面例です。');setMode('mfa')}else setMode('mfa')}}><label className="field">メールアドレス<input type="email" required value={email} onChange={e=>setEmail(e.target.value)} autoComplete="off"/></label>{mode!=='reset'&&<label className="field">{mode==='invite'?'設定するパスワード（デモ）':'パスワード（デモ）'}<input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="試作用の文字列を入力" autoComplete="off"/></label>}<Btn type="submit" kind="primary">{mode==='reset'?'再設定の流れを確認':mode==='invite'?'MFA設定へ進む':'多要素認証へ進む'}</Btn><button type="button" className="linkbtn small" onClick={()=>setMode(mode==='reset'?'login':'reset')}>{mode==='reset'?'ログインに戻る':'パスワードを再設定する'}</button>{mode==='login'&&<button type="button" className="linkbtn small" onClick={()=>setMode('invite')}>招待を受け取った場合の画面例</button>}</form>}</div>}
function ErrorPage({type,nav}){const info={forbidden:['この顧客を閲覧する権限がありません','割当を管理者に確認してください。顧客の診断内容は表示しません。'],network:['通信を確認してください','再試行しても復旧しない場合は、時間をおいて操作してください。'],notfound:['ページが見つかりません','URLが変更されたか、対象のページが存在しません。'],render:['画面を表示できませんでした','画面単位のエラー表示です。顧客一覧から再度開いてください。'],loading:['読み込み中','診断内容を取得しています。'],empty:['診断はまだ始まっていません','対象範囲を決めて、スクリーニング結果を取り込んでください。']}[type]||['ページが見つかりません','顧客一覧へ戻ってください。'];return <section className="panel"><Empty title={info[0]} sub={info[1]}>{type==='loading'?<div style={{maxWidth:350,margin:'auto'}}><div className="loadingbar"/><div className="loadingbar"/><div className="loadingbar"/></div>:<div className="row" style={{justifyContent:'center'}}>{type==='network'&&<Btn kind="primary" onClick={()=>nav('dashboard')}>再試行</Btn>}{type==='empty'&&<Btn kind="primary" onClick={()=>nav('import')}>Excelを取り込む</Btn>}<Btn onClick={()=>nav('clients')}>顧客一覧へ戻る</Btn></div>}</Empty></section>}
function EvidenceForm({criterion,onSave}){const [name,setName]=useState(''),[location,setLocation]=useState(''),[url,setUrl]=useState(''),[id,setId]=useState(criterion),[file,setFile]=useState(null),[error,setError]=useState('');return <form className="stack" onSubmit={e=>{e.preventDefault();if(url){try{if(!['https:','http:'].includes(new URL(url).protocol))throw Error()}catch{setError('参照先には https:// または http:// のURLを入力してください。');return}}onSave({name,location,url,criterion:id,file,checked:false})}}><label className="field">文書名<input required value={name} onChange={e=>setName(e.target.value)} placeholder="例：セキュリティ連絡先一覧"/></label><label className="field">関連する評価基準<select value={id} onChange={e=>setId(e.target.value)}>{BASE.map(r=><option key={r.id} value={r.id}>{r.id} {r.title}</option>)}</select></label><label className="field">該当箇所<input required value={location} onChange={e=>setLocation(e.target.value)} placeholder="例：第2章 / 3ページ"/></label><label className="field">参照URL（任意）<input type="url" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://..."/></label><label className="field">添付ファイル（任意）<input type="file" onChange={e=>setFile(e.target.files[0]||null)}/></label><p className="small muted">この試作内で一時的に保持します。外部保存・AI送信は行いません。</p>{error&&<p role="alert" style={{color:'var(--red)'}}>{error}</p>}<Btn type="submit" kind="primary">証跡を関連付ける</Btn></form>}
function ScopeForm({client,onSave}){const [name,setName]=useState(client?.name||''),[scope,setScope]=useState(client?.scope||{company:'',sites:'',departments:'',systems:''});return <form className="stack" onSubmit={e=>{e.preventDefault();onSave(name,scope)}}><label className="field">顧客の表示名<input required value={name} onChange={e=>setName(e.target.value)} placeholder="例：対象企業B"/></label>{[['company','対象会社'],['sites','対象拠点'],['departments','対象部署'],['systems','対象システム']].map(([key,label])=><label className="field" key={key}>{label}<input required value={scope[key]} onChange={e=>setScope({...scope,[key]:e.target.value})}/></label>)}<p className="small muted">個別の除外や条件は、診断の適用範囲として後から追記する設計です。</p><Btn type="submit" kind="primary">対象範囲を保存</Btn></form>}

参照 / 確認状況 / 確定済み助言 / 担当者 / 期限 / 進捗</p>}</div></Modal>}</>}
function DesignDocs({tab,onPreview}){if(tab==='overview')return <div className="docpage"><div className="eyebrow">SCS / PRODUCT DESIGN / 2026.09.18</div><h1>★3取得に向けた、診断と改善の作業台。</h1><p className="docintro">複数顧客のスクリーニング結果を取り込み、根拠を確認し、具体的な改善と報告につなげる社内向けサービスです。要件整理をもとにした初回スケッチです。</p><div className="row wrap" style={{marginTop:22}}><Btn kind="primary" icon="arrow" onClick={()=>onPreview('dashboard')}>プロトタイプを開く</Btn><span className="pill blue">初回は★3</span><span className="pill">★4は次段階</span></div><div className="panel"><div className="panelhead"><h2>画面一覧</h2><span className="small muted">画面名を選ぶと試せます</span></div><div className="tablewrap"><table><thead><tr><th>画面</th><th>役割・操作</th><th>関連ストーリー</th></tr></thead><tbody>{SCREENS.map(([id,name,us,desc])=><tr key={id}><td><button className="linkbtn" onClick={()=>onPreview(id)}>{name}</button></td><td>{desc}</td><td className="mono small">{us}</td></tr>)}</tbody></table></div></div><div className="threecol" style={{marginTop:20}}><div className="panel panelpad" style={{margin:0}}><h3>確定した機能</h3><p className="small muted" style={{marginTop:10}}>Excel取込・集計、定型＋AI助言、PDF・Excel、証跡添付、改善管理、再診断比較、招待制＋MFA。</p></div><div className="panel panelpad" style={{margin:0}}><h3>今回の仮置き</h3><p className="small muted" style={{marginTop:10}}>白・紺・青の業務画面。管理者は全顧客、担当者は割当顧客のみ。進行指示を受けた設計上の仮定です。</p></div><div className="panel panelpad" style={{margin:0}}><h3>製造前に詰めること</h3><p className="small muted" style={{marginTop:10}}>利用規模、公開時期、クラウド保存条件、保持・削除期間、AI契約。データの実保存・送信は未実装です。</p></div></div><div className="panel panelpad"><h2>スケッチの操作範囲</h2><p className="small" style={{marginTop:10}}>基準の検索、判定・確認メモの編集、助言の確認・確定、課題の追加と進捗更新、証跡の関連付け、顧客の追加、状態変更の比較、印刷プレビューを操作できます。変更はブラウザ内のメモリだけに保持され、再読み込みで元に戻ります。</p><p className="small muted" style={{marginTop:10}}>ファイル解析・AI生成・認証・クラウド保存・PDF/Excelの正式生成は画面例です。顧客固有の原文や内部URLはスケッチに含めていません。画面表示にはCDNのライブラリを使います。</p></div></div>;
if(tab==='flows'){const flows=[['初回診断','Excelを取り込み、結果と対象範囲を確認する。US-001〜005',[['clients','顧客・案件','対象範囲を記入'],['import','Excel取込','列対応と81基準を確認'],['dashboard','現状把握','状態別・領域別の集計'],['detail','基準の確認','原文・根拠を確認']]],['助言を顧客向けに整える','定型助言を土台にし、必要な場合にAIの案を追加する。US-008〜010',[['detail','不足点の確認','公式基準と事実を照合'],['detail','AIの入力確認','匿名化した内容だけ'],['detail','案を編集・確定','担当者が内容を確認'],['report','レポート','確定した助言を掲載']]],['改善を追跡する','作業完了と要件の充足を別に確認する。US-006 / 007 / 011〜013',[['tasks','改善課題','担当・期限・進捗'],['evidence','証跡の追加','文書・設定・運用記録'],['detail','根拠と判定','実施内容を確認'],['compare','再診断比較','状態の変更を表示']]],['招待制のアクセス','未認証・MFA未完了では顧客データを表示しない。US-017',[['login','招待・登録','利用者を限定'],['login','パスワード','認証情報の入力'],['login','多要素認証','6桁コードの確認'],['clients','許可された顧客','割当範囲で操作']]]];return <div className="docpage"><h1>ユーザーフロー</h1><p className="docintro">各ボックスから対応する画面例を開けます。AI利用とレポート掲載の間に、担当者の確認を挟みます。</p>{flows.map(([title,note,steps])=><section className="panel" key={title}><div className="panelhead"><div><h2>{title}</h2><p className="small muted">{note}</p></div></div><div className="flow">{steps.map(([id,label,desc],i)=><React.Fragment key={label}>{i>0&&<div className="flowarrow"><Icon name="arrow"/></div>}<button className="flowbox" onClick={()=>onPreview(id)}><strong>{label}</strong><p>{desc}</p></button></React.Fragment>)}</div></section>)}<div className="panel panelpad"><h2>異常時の戻り先</h2><p className="small" style={{marginTop:10}}>取込エラー → 行・列・原因を示して再選択。AIエラー → 入力を保持して再試行または手動編集。権限なし → 顧客一覧。404 → 明示的なエラー画面。通信エラー → 再試行。</p></div></div>}
if(tab==='elements')return <div className="docpage"><h1>画面要素・インタラクション</h1><p className="docintro">主な操作と、その結果を整理しています。試作の操作と、本番で必要な処理を区別します。</p><div className="panel tablewrap"><table><thead><tr><th>画面 / 操作</th><th>結果・状態</th><th>本番での扱い</th></tr></thead><tbody>{[['ダッシュボード / 基準マップを選択','選択した評価基準の詳細へ移動','基準No.と制度版を保持'],['評価基準 / 記号・分類・語句で検索','該当基準と件数を表示','未回答は不足と分ける'],['判定 / 保存','現在の自己評価と確認状態を更新','取込原文を保持し、必要な確認記録を残す'],['AI / 送信内容を確認','匿名化文と基準を確認して固定の案を表示','確認済みの許可された入力だけを外部送信'],['助言 / 確定','確定した文章がレポートに反映','確認者・日時・参照版を記録'],['改善課題 / 進捗を変更','未着手・対応中・確認待ちを更新','基準の自己評価は自動変更しない'],['証跡 / 追加・確認','文書・該当箇所・リンク・一時ファイルを関連付け','認可された保存先に格納、本文はAI送信対象外'],['再診断 / 比較','取込時と編集後の状態変更を表示','診断時点・対象範囲・制度版を合わせて比較'],['レポート / PDF確認','現在の表示をブラウザで印刷','経営サマリーと詳細をまとめたPDFを生成'],['レポート / Excel確認','出力列の設計を表示','自己評価・根拠・対策・作業を出力'],['顧客 / 追加・範囲編集','試作内に顧客・対象範囲を保存','案件ごとの権限をサーバ側でも検証']].map(([a,b,c])=><tr key={a}><td style={{minWidth:220}}>{a}</td><td>{b}</td><td>{c}</td></tr>)}</tbody></table></div><div className="panel panelpad"><h2>判定の意味を保つ</h2><div style={{margin:'15px 0'}}><Legend/></div><p className="small">○＝満たしているという自己評価。△＝判断微妙。✖＝不足。空欄＝未回答。△を半点にしたり、✖→△を自動的に改善と数えたりしません。証跡確認・助言確定・作業完了は別の状態として記録します。</p></div><div className="panel panelpad"><h2>共通のアプリ構成</h2><p className="small">ヘッダーに顧客・診断案件・利用者・ログアウト。左ナビに現状・基準・課題・証跡・比較・レポート。未認証時はログインへ移動し、MFA後に元の画面に戻ります。画面単位のErrorBoundary、空状態、404、権限なし、通信障害、読み込み表示を用意します。</p><p className="small muted" style={{marginTop:10}}>通知は右下に1件、5秒で消去し、閉じる操作も可能。入力エラーは該当箇所に残します。モーダルはEscで閉じられ、キーボード操作に対応します。</p></div></div>;
return <div className="docpage"><h1>デザイン方針</h1><p className="docintro">資料を読み比べ、根拠を確認する仕事のための、落ち着いた業務画面。参考HTMLの5タブ構成を引き継ぎ、SCSの診断・改善に合わせています。</p><div className="panel panelpad"><h2>視覚の中心：81基準のマップ</h2><p className="small" style={{marginTop:10}}>1つのマスを1評価基準に対応させ、分類別の状況を俯瞰します。達成率だけで状況を判断せず、未回答や判断が微妙な項目へ直接移動できる構造です。</p></div><div className="panel panelpad"><h2>色・書体・密度</h2><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:18,marginTop:20}}>{[['インク','#172c4c'],['操作','#225cca'],['下地','#f4f7fb'],['紙面','#ffffff'],['○','#17806a'],['△','#9a650e'],['✖','#b04646']].map(([label,color])=><div key={label}><div className="swatch" style={{background:color,border:'1px solid var(--line)'}}/><strong className="small">{label}</strong><p className="mono small muted">{color}</p></div>)}</div><p className="small" style={{marginTop:25}}>本文：Yu Gothic UI / Meiryo / system-ui。数値・基準番号：Bahnschrift / Consolas。本文と番号を分け、照合しやすくします。色には記号と文字を添えます。</p><p className="small muted" style={{marginTop:10}}>PCを中心に設計し、狭い画面ではナビを横方向、詳細を縦方向に配置。操作のフォーカスを可視化し、動きを減らす設定に対応します。</p></div><div className="panel panelpad"><h2>情報の出所を分ける</h2><p className="small" style={{marginTop:10}}>公式要件、取込時の自己評価、担当者の確認、助言の例、AIの未確認案、確定済みの助言を別のラベルで表示します。制度の取得を自動判定する表示は置きません。</p></div><div className="panel panelpad"><h2>製造の基盤</h2><p className="small" style={{marginTop:10}}>指定の <a href="https://github.com/skanehira/fullstack-worker-template" target="_blank" rel="noreferrer">fullstack-worker-template</a> を採用します。React / Hono / Cloudflare Workers / D1 を基盤とし、Excel解析・証跡保管・AI・出力の方式を検証してから実装します。</p><p className="small muted" style={{marginTop:10}}>本ファイルは設計用の単一HTMLです。製造アプリは未実装。公開や実データのクラウド保存は行っていません。</p></div><div className="panel panelpad"><h2>調査根拠</h2><div className="stack small" style={{marginTop:14}}><a href="https://www.ipa.go.jp/security/scs/requirements-criteria.html" target="_blank" rel="noreferrer">IPA 要求事項・評価基準</a><a href="https://www.ipa.go.jp/security/scs/details.html" target="_blank" rel="noreferrer">IPA 制度の詳細</a><a href="https://www.ipa.go.jp/security/scs/regulation-advisory-committeess.html" target="_blank" rel="noreferrer">IPA 制度規程・委員会</a></div></div></div>}
function App(){const [tab,setTab]=useState('prototype'),[requested,setRequested]=useState('dashboard'),[key,setKey]=useState(0);const preview=s=>{setRequested(s);setKey(k=>k+1);setTab('prototype')};return <><header className="reviewbar"><div className="reviewtop"><div><span className="reviewbrand">SCS 診断・助言サービス</span><span className="reviewlabel">DESIGN REVIEW / v0.1</span></div><span className="small muted">設計スケッチ · 2026.09.18</span></div><nav className="reviewtabs" aria-label="設計ドキュメント">{[['overview','画面一覧'],['flows','ユーザーフロー'],['prototype','クリッカブルプロトタイプ'],['elements','画面要素・インタラクション'],['design','デザイン方針']].map(([id,label])=><button key={id} className={tab===id?'active':''} aria-current={tab===id?'page':undefined} onClick={()=>setTab(id)}>{label}</button>)}</nav></header><div hidden={tab!=='prototype'}><Prototype key={key} requestedScreen={requested}/></div>{tab!=='prototype'&&<DesignDocs tab={tab} onPreview={preview}/>}</>}
createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
