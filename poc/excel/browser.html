<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel PoC — 匿名テスト</title>
<style>body{max-width:920px;margin:3rem auto;padding:0 1.5rem;font:16px/1.75 system-ui,sans-serif;color:#172b45;background:#f4f7fb}main{padding:2rem;background:white;border-radius:14px}h1{font-size:1.7rem}pre{white-space:pre-wrap;background:#eef3f8;padding:1rem;font-size:.86rem}#status{font-weight:700;color:#185d49}</style>
<main><h1>Excel取込・書出しの技術検証</h1>
<p>公開要件と匿名回答だけを使ってブラウザ内で検証します。顧客の回答や証跡は読み込まず、外部へ送信しません。</p>
<p id="status" role="status">検証中…</p><pre id="result"></pre></main>
<script src="vendor/exceljs.min.js"></script>
<script src="core.js"></script>
<script src="scenarios.js"></script>
<script>
(async () => {
  try {
    const master = await (await fetch('./master.json')).json();
    const result = await ScsExcelScenarios.run(ExcelJS, ScsExcelPoc, master);
    document.getElementById('status').textContent = `PASS — ${result.passed} assertions`;
    document.getElementById('result').textContent = JSON.stringify({
      browser: navigator.userAgent, passed: result.passed, counts: result.totals,
      mergedRows: result.mergedRows, boundaries: result.boundaries, checks: result.checks
    }, null, 2);
  } catch (error) {
    document.getElementById('status').textContent = 'FAIL';
    document.getElementById('result').textContent = error.message;
  }
})();
</script>
</html>
